# OpenGalaxy behind nginx. Replace the server_name, certificate paths and root.
# WebHID only works over HTTPS, so the plain-HTTP server just redirects.

server {
    listen 80;
    server_name galaxy.example.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name galaxy.example.lan;

    ssl_certificate     /etc/ssl/certs/galaxy.crt;
    ssl_certificate_key /etc/ssl/private/galaxy.key;

    # Folder containing index.html, theme-init.js, favicon.svg and assets/
    root /var/www/opengalaxy;
    index index.html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/opengalaxy-headers.conf;
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/opengalaxy-headers.conf;
    }
}

# --- /etc/nginx/snippets/opengalaxy-headers.conf ---------------------------
# (add_header in a location replaces inherited ones, hence the shared snippet)
